# Forgejo Actions port of the GitHub workflow (.github/workflows/ci.yml,
# removed in the same commit). Structural changes vs. the GitHub original —
# same conventions as faster-whisper-frontend/ci.yml and
# nextcloud-fpm-nginx/build.yml:
#
#   * Actions are referenced unqualified (owner/repo@ref): the instance sets
#     DEFAULT_ACTIONS_URL to itself, so refs resolve against local pull
#     mirrors (orgs: actions, docker). REQUIRES app.ini [actions]
#     DEFAULT_ACTIONS_URL = https://forgejo.informethic.ch — without it,
#     unqualified refs fall back to code.forgejo.org. Before bumping any
#     @version, confirm the mirror has synced that tag (8h interval, or
#     "Synchronize now" in the mirror repo's settings).
#   * actions/setup-python is NOT mirrored on the instance, and it would
#     download interpreter builds from GitHub at runtime anyway. The Linux
#     test legs instead run in official python:<ver> containers (job-level
#     `container:`), which pins the interpreter without any GitHub
#     dependency. The full (non-slim) image ships git + build toolchain.
#   * python containers have no node, so JS actions (actions/checkout) can't
#     run there — the test legs check out manually with plain git, using the
#     run-scoped actions token (same manual-checkout pattern as the
#     frontend's host-mode Windows legs, which exists there because
#     actions/checkout's credential persistence breaks in host mode).
#   * windows-latest runs on the self-hosted Windows VM runner (host mode,
#     label windows-latest:host — see forgejo-runner-windows/
#     windows-runner-setup.md). It uses the SYSTEM python, like the frontend
#     uses the system node. VM prerequisite (one-time, admin PowerShell):
#         choco install -y python nodejs ffmpeg
#     then add C:\Python314;C:\Python314\Scripts to the nssm
#     AppEnvironmentExtra PATH (setup guide §5) and `nssm restart
#     forgejo-runner`. Until then this leg fails at "python not found".
#     node and ffmpeg are prerequisites, not conveniences: the suite guards
#     the inline <script> blocks with `node --check` and decodes real
#     WebM/Opus with ffmpeg, and both guards SKIP themselves when the tool
#     is missing — the leg would report green having checked neither. The
#     "Verify system test tools" step fails loudly instead; the Linux legs
#     apt-install the same two tools into their container.
#   * Registry: ghcr.io -> the Forgejo container registry (REGISTRY env).
#     Auth via a PAT (secrets.REGISTRY_USER / REGISTRY_TOKEN, scope
#     package:write — same secret pair as nextcloud-fpm-nginx) instead of
#     the ephemeral GITHUB_TOKEN; the GHCR login retry-loop is gone (local
#     registry, no flaky token proxy).
#   * Buildx cache: type=gha -> type=registry on the Forgejo registry
#     (buildcache-<variant> tags), per-variant so cpu/gpu don't evict each
#     other, and per-producer so one PR can't clobber another's — see the
#     "Compute buildx cache refs" step. ignore-error on export: a transient
#     cache-push failure must not fail a publish.
#   * Image layers are pushed zstd-compressed, matching the cache, so a
#     cached layer is reused as a blob instead of being re-gzipped on every
#     export. Needs Docker >= 23 on the hosts that pull these images.
#   * buildkitd docker.io mirror (mirror.gcr.io): both variants resolve the
#     python:3.x-slim base from Docker Hub; the mirror keeps repeated
#     matrix/PR builds away from Hub's anonymous rate limit.
#   * provenance/sbom disabled — buildx attestation manifests
#     (unknown/unknown entries) have a spotty history with Forgejo
#     registries.
#   * permissions: blocks dropped — GitHub token-permission model.
name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# Cancel superseded PR runs; push runs are kept (they publish images).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # The instance host, spelled out once for the whole file: it is both the
  # container registry and the git remote the manual checkouts fetch from
  # (they read it via a GIT_HOST step env). Keep it that way — a hostname
  # copy that only fails at fetch time is the drift this replaces.
  REGISTRY: forgejo.informethic.ch
  # The Linux test legs run as root inside python:* job containers — that's
  # the whole environment, not a system Python worth protecting, so silence
  # pip's per-invocation "Running pip as the 'root' user" warning.
  PIP_ROOT_USER_ACTION: ignore

jobs:
  test:
    name: tests (ubuntu-latest py${{ matrix.python-version }})
    # Skipped on v* tag runs — tag-first flow (2026-08-27): a tag is only
    # ever minted for a commit that already tested green (release.yml
    # enforces it on both its paths), so the tag run goes straight to the
    # image build instead of re-running the suites. Skipping a needed job
    # is safe since Forgejo v16 (16.0.3 here): the server evaluates job
    # `if` itself (PR #13030); on v15 this would have hung the run
    # (forgejo#12937).
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    # Exact interpreter via the official image — replaces setup-python (see
    # header). The matrix value is interpolated into the tag, so Renovate's
    # github-actions manager skips it; bump the list by hand when a new
    # Python minor lands (the Docker tag floats on patch releases by itself).
    container:
      image: python:${{ matrix.python-version }}-trixie
    strategy:
      fail-fast: false
      matrix:
        # ubuntu is the primary target and is exercised across the supported
        # Python range; windows (below) is a portability parity guard.
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      # Manual checkout — no node in the python image, so actions/checkout
      # (a JS action) cannot run. The run-scoped actions token authenticates
      # the fetch, so this works regardless of repo visibility. Ref and token
      # reach git through the step env instead of being expanded into the
      # script text: `git check-ref-format` permits $ ( ) ` ; & | in a tag
      # name, and this workflow triggers on v* tags.
      - name: Checkout
        env:
          GIT_REF: ${{ github.ref }}
          GIT_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Single-source the instance host from env.REGISTRY above (it is
          # the same host that serves git and the registry). The rest of the
          # family derives it too — mirror-ghcr.yml strips GITHUB_SERVER_URL
          # — so an instance rename stays a one-line edit instead of a hunt
          # for literals that only surface as a DNS/auth error mid-fetch.
          GIT_HOST: ${{ env.REGISTRY }}
        run: |
          # Fetch from the credentialed URL directly instead of `git remote
          # add`: that persists the token verbatim into .git/config, where any
          # later `git remote -v` or remote-echoing error puts it in the job
          # log. Matters most on the host-mode Windows leg below, whose
          # workspace is a real directory on a long-lived VM with no cleanup —
          # but keep both legs identical so the pattern does not drift back.
          git init -q .
          git -c protocol.version=2 fetch --no-tags --prune --no-recurse-submodules --depth=1 "https://x-access-token:${GIT_TOKEN}@${GIT_HOST}/${{ github.repository }}.git" "$GIT_REF"
          git checkout -q --force FETCH_HEAD
          # --force resets tracked files only. A no-op in this ephemeral
          # container, but the persistent Windows workspace below would carry
          # .coverage / __pycache__ / test-created dirs into the next run —
          # keep both legs identical so each starts from the ref's content.
          git clean -qffdx

      # python:<ver>-trixie ships neither node nor ffmpeg, and the suite does
      # not fail without them — it SKIPS its two real guards:
      # test_inline_scripts_parse (`node --check` over the inline <script>
      # blocks of /settings/pipeline, /quick-config and /settings) and the
      # WebM/Opus transport tests (the only ones decoding MediaRecorder-shaped
      # input). A silently skipped guard is not coverage, so install both.
      - name: Install system test tools (node, ffmpeg)
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends nodejs ffmpeg
          rm -rf /var/lib/apt/lists/*
          node --version
          ffmpeg -version | head -1

      # No pip cache: the job container is ephemeral and actions/cache is a
      # JS action (no node here). The deps are modest CPU wheels; PyPI is
      # not rate-limited the way Docker Hub is.
      - name: Install dependencies (CPU base + test tools)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      # Coverage is gated: the suite must exercise at least this percent of
      # the application modules, so coverage can only ratchet upward. A
      # shortfall fails this leg, which fails the `all-ci` gate below, which
      # blocks auto-merge / release publishing. Baseline measured at 66% on
      # Linux; set a few points lower so the Windows leg (which skips the
      # POSIX-only timezone tests) and minor per-version variance don't
      # false-fail. Raise this number as coverage grows — never lower it.
      - name: Run tests (with coverage gate)
        run: pytest -q --cov-fail-under=63

  # Windows portability parity guard — a single leg on the self-hosted VM
  # runner (host mode), using the system python (VM prerequisite in the
  # header). Steps mirror the frontend's windows legs: manual checkout,
  # `python -m` invocations (Scripts\ shims may lag the service PATH).
  test-windows:
    name: tests (windows-latest)
    # Skipped on tag runs — see the `test` job.
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: windows-latest
    steps:
      # Same env indirection as the Linux legs above, in PowerShell spelling:
      # host-mode `run:` steps default to pwsh (no `shell: bash` here), so the
      # step env is read as $env:NAME.
      - name: Checkout
        env:
          GIT_REF: ${{ github.ref }}
          GIT_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Same single-sourced host as the Linux leg (env.REGISTRY).
          GIT_HOST: ${{ env.REGISTRY }}
        run: |
          # No `git remote add`: see the Linux leg. This runner is host mode,
          # so .git/config survives the job on a persistent machine.
          git init -q .
          git -c protocol.version=2 fetch --no-tags --prune --no-recurse-submodules --depth=1 "https://x-access-token:${env:GIT_TOKEN}@${env:GIT_HOST}/${{ github.repository }}.git" "$env:GIT_REF"
          git checkout -q --force FETCH_HEAD
          # The workspace is a real directory on a long-lived VM with no
          # cleanup, and --force resets tracked files only: without this,
          # .coverage / __pycache__ / dirs a test wrote under the repo root
          # survive into the next run and make the parity guard depend on
          # what ran before it.
          git clean -qffdx

      # The VM is provisioned by hand (header prerequisite), so assert the
      # tools the suite's guards need are on PATH. Missing, they only make
      # test_inline_scripts_parse and the WebM/Opus transport tests skip,
      # and the leg goes green having checked nothing.
      - name: Verify system test tools (node, ffmpeg)
        run: |
          $missing = @('node', 'ffmpeg') | Where-Object { -not (Get-Command $_ -ErrorAction SilentlyContinue) }
          if ($missing) {
            Write-Output "::error::not on the runner PATH: $($missing -join ', ') - run 'choco install -y nodejs ffmpeg' on the VM (workflow header) and restart the runner service"
            exit 1
          }
          node --version
          ffmpeg -version | Select-Object -First 1

      # Host mode: this installs into the VM's system python and doubles as
      # a warm cache across runs (same trade-off as the frontend's persistent
      # cargo cache). Renovate PRs keep the pins current, so drift converges.
      - name: Install dependencies (CPU base + test tools)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests (with coverage gate)
        run: python -m pytest -q --cov-fail-under=63

  # Single, stable status check to require in the branch protection. Matrix
  # legs expand/rename over time; this gate aggregates them so the required
  # check name never changes. It fails unless EVERY leg succeeded — so
  # Renovate automerge only proceeds when the whole suite is green on all
  # platforms. (Skipped needs-jobs no longer hang the run since Forgejo
  # v16 — server-side `if` evaluation, PR #13030 — which is what allows
  # the tag-run skips asserted below.)
  all-ci:
    name: all-ci
    if: always()
    needs: [test, test-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Require all test legs to succeed
        run: |
          echo "test=${{ needs.test.result }} test-windows=${{ needs.test-windows.result }}"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            # Tag runs skip the suites (the tagged commit already tested
            # green — see the test job); "skipped" is the expected verdict
            # here, and anything else means the skip condition regressed.
            test "${{ needs.test.result }}" = "skipped"
            test "${{ needs.test-windows.result }}" = "skipped"
          else
            test "${{ needs.test.result }}" = "success"
            test "${{ needs.test-windows.result }}" = "success"
          fi

  # Build (and, off PRs, publish) the container images — tag-first flow
  # (2026-08-27): a main push runs ONLY the test legs; its green verdict
  # dispatches release.yml (see the mirror job below), which mints the next
  # v* tag, and THAT tag's run — this job — is the single image build per
  # release, baking the clean vX.Y.Z. Main-push runs skip this job
  # entirely: no double builds, and no interim :latest carrying a
  # describe-suffixed version. PRs still build to validate the Dockerfiles
  # without pushing; a workflow_dispatch run builds and publishes sha tags
  # (manual rebuild escape hatch). The all-ci gate still fronts every
  # publish: on tag runs it verifies the suites were skipped deliberately
  # (the tagged commit tested green on its main-push run).
  #
  # Four variants build in parallel from the same context:
  #   cpu      — Dockerfile      → :latest, :v*, :sha-<short>     (CPU-only base)
  #   gpu      — Dockerfile.gpu  → :latest-gpu, …                 (CUDA 12 / cuDNN 9
  #              wheels from requirements-gpu.txt)
  #   cpu-full — Dockerfile      → :latest-full, …                (INCLUDE_EXTRAS=1:
  #              everything that Dockerfile's INCLUDE_EXTRAS block installs —
  #              diarization/pyannote + music separation (audio-separator) +
  #              llama-cpp translation, plus apt ffmpeg and a build-and-purge
  #              gcc/g++ cycle. That block stays the source of truth.)
  #   gpu-full — Dockerfile.gpu  → :latest-gpu-full, …            (extras on the cu126
  #              torch index so ctranslate2's pip CUDA libs are shared)
  # The suffix is applied to every tag via metadata-action's flavor.suffix.
  build:
    name: build image (${{ matrix.variant }})
    needs: [all-ci]
    if: ${{ needs.all-ci.result == 'success' && (github.event_name != 'push' || startsWith(github.ref, 'refs/tags/')) }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: cpu
            dockerfile: Dockerfile
            suffix: ''
            extras: '0'
          - variant: gpu
            dockerfile: Dockerfile.gpu
            suffix: '-gpu'
            extras: '0'
          - variant: cpu-full
            dockerfile: Dockerfile
            suffix: '-full'
            extras: '1'
          - variant: gpu-full
            dockerfile: Dockerfile.gpu
            suffix: '-gpu-full'
            extras: '1'
    steps:
      # actions/checkout works here (unlike the test legs): the catthehacker
      # job image has node, and the host-mode credential bug doesn't apply
      # in container mode.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Full history + tags so `git describe` below can anchor the build
          # version to the newest v* tag (shallow default sees no tags).
          fetch-depth: 0

      # Registry repository paths must be lowercase, but the owner
      # (v3DJG6GL) is not. metadata-action lowercases its own refs, yet the
      # buildx cache-from/cache-to refs below pass through verbatim — an
      # upper-case ref fails the build ("repository name must be
      # lowercase"). Derive the full lowercase owner/repo path once, from
      # github.repository, so an owner or repo rename never needs an edit
      # here.
      - name: Compute image name (registry requires lowercase)
        id: img
        run: echo "name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      # The version baked into the image (build_info.py reads it from the
      # WHISPER_BUILD_VERSION env). Tag-anchored and bumps with every commit:
      # "v0.1.0" on a tagged build, "v0.1.0-3-g1a2b3c4" three commits later.
      - name: Compute build version (git describe)
        id: ver
        run: echo "version=$(git describe --tags --always)" >> "$GITHUB_OUTPUT"

      # Buildx cache refs, per variant AND per producer.
      #
      # One shared PR bucket did not work (2026-08-31): every open PR wrote
      # buildcache-<variant>-pr, so a long-lived base-digest PR and a routine
      # pin bump PR overwrote each other, and whether a release build hit its
      # cache came down to which PR had exported last. Run 624 caught it
      # mid-race — gpu-full read the useful bucket and finished in 21 s while
      # the other three variants read a clobbered one and rebuilt for 2-9 min.
      #
      # So each PR gets its OWN bucket, and non-PR runs (tags, dispatch) keep
      # the main one. To let a release build still reuse the work its PR
      # already did, non-PR runs additionally read the bucket of the PR named
      # in the merge commit's subject — Renovate squash-merges land as
      # "chore(deps): update dependency pydantic to >=2.13.5 (#76)", so the
      # number is right there. Missing buckets are not an error: buildkit logs
      # "failed to configure registry cache importer: not found" and carries on.
      #
      # Stale buckets from abandoned PRs are the cost of this; they are cache
      # tags on the container package and can be deleted in the registry UI.
      - name: Compute buildx cache refs
        id: cache
        env:
          EVENT: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          IMAGE: ${{ env.REGISTRY }}/${{ steps.img.outputs.name }}
          VARIANT: ${{ matrix.variant }}
        run: |
          set -euo pipefail
          base="${IMAGE}:buildcache-${VARIANT}"

          scope=""
          if [ "$EVENT" = "pull_request" ]; then
            # github.event.pull_request.number is the documented field; fall
            # back to the ref (refs/pull/<n>/{head,merge}) so a payload shape
            # difference degrades to the old shared bucket instead of failing.
            n="$PR_NUMBER"
            [ -n "$n" ] || n=$(printf '%s' "$GITHUB_REF" | sed -n 's|^refs/pull/\([0-9]\+\)/.*|\1|p')
            scope="-pr-${n:-shared}"
          fi

          echo "to=type=registry,ref=${base}${scope},mode=max,ignore-error=true,compression=zstd,force-compression=true" >> "$GITHUB_OUTPUT"

          {
            echo "from<<CACHE_REFS"
            echo "type=registry,ref=${base}"
            if [ -n "$scope" ]; then
              echo "type=registry,ref=${base}${scope}"
            else
              merged=$(git log -1 --format=%s | sed -n 's|.*(#\([0-9]\+\))$|\1|p')
              if [ -n "$merged" ]; then
                echo "type=registry,ref=${base}-pr-${merged}"
              fi
            fi
            echo CACHE_REFS
          } >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4
        with:
          # Resolve docker.io refs (the python base image) via Google's
          # pull-through mirror — repeated PR/matrix builds otherwise eat
          # into Docker Hub's anonymous rate limit. buildkit falls back to
          # docker.io on a mirror miss, so this can only help.
          #
          # network=host puts the builder in the dind daemon's netns (same
          # as the job containers, per runner-config container.network).
          # Without it the builder sits on a dind bridge whose DNS falls
          # back to 8.8.8.8, resolves the instance's public WAN IP, and
          # hairpins all registry traffic (cache-from/push) through the LAN
          # firewall. In the dind netns it resolves via the outer embedded
          # DNS, which answers with the reverse proxy's container alias.
          driver-opts: network=host
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]

            [worker.oci]
              gc = true
              gckeepstorage = "50GB"

      # Needed on PRs too: the buildx cache lives on the Forgejo registry.
      - name: Log in to the Forgejo registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ steps.img.outputs.name }}
          # latest=false: we control the `latest` tag via the type=raw rule
          # below. Tag-first flow: only v* tag runs build-and-push, so
          # latest is owned by tag runs and always carries the clean
          # vX.Y.Z baked version — never a describe-suffixed interim.
          # Every green main push gets a tag (release.yml), so latest
          # still tracks main; the exception is commits marked
          # [skip release], which now publish no images at all.
          # suffix appends "-gpu" to every tag for the gpu leg;
          # onlatest=true ensures it reaches the raw `latest` tag too.
          flavor: |
            latest=false
            suffix=${{ matrix.suffix }},onlatest=true
          tags: |
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=ref,event=tag
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILD_VERSION=${{ steps.ver.outputs.version }}
            INCLUDE_EXTRAS=${{ matrix.extras }}
          # Attestation manifests have a spotty history with Forgejo
          # registries — off until verified on this instance.
          provenance: false
          sbom: false
          # zstd image layers, via `outputs` rather than `push:` (the two are
          # the same --output flag and cannot both be set). The build cache is
          # already zstd; the image was still gzip, so EVERY layer restored
          # from cache had to be decompressed and re-gzipped at export — 702 s
          # on the gpu-full leg of run 593, 134 s on run 624's gpu leg, even
          # for layers that never changed. Matching the two formats lets
          # buildkit reuse the cached blob as-is.
          # No force-compression: the base image's own layers stay gzip, so
          # they keep deduplicating against every other python:3.14-slim image
          # in the registry instead of being recompressed into private copies.
          # COMPATIBILITY: pulling zstd layers needs Docker >= 23 (2023),
          # containerd >= 1.5, or any current podman. Every host that runs
          # these images must clear that bar.
          outputs: type=image,push=${{ github.event_name != 'pull_request' }},compression=zstd,oci-mediatypes=true
          # Per-variant, per-producer registry cache — see the "Compute buildx
          # cache refs" step for what the refs are and why.
          # cache-to deliberately lives in the separate step below — see there.
          cache-from: ${{ steps.cache.outputs.from }}

      # Cache export runs as its own buildx invocation, AFTER the push above.
      # Sharing one invocation makes buildkit push the image layers and export
      # the cache concurrently, so a layer new to the registry gets uploaded
      # twice at once. Forgejo's GetOrInsertBlob does a SELECT-then-INSERT with
      # no upsert: the losing writer trips the UQE_package_blob_blake2b unique
      # index and the error path nil-derefs (2026-08-04, run 80 — the 1.66 GB
      # CUDA layer panicked the server, the retry 400'd, and buildx reported
      # only "failed to push …:latest-gpu: unknown"). Serializing the two
      # writers removes the overlap. Everything is cached locally by now, so
      # this step costs seconds; ignore-error keeps a transient cache-push
      # failure from failing an already-published image.
      - name: Export build cache
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          build-args: |
            BUILD_VERSION=${{ steps.ver.outputs.version }}
            INCLUDE_EXTRAS=${{ matrix.extras }}
          provenance: false
          sbom: false
          cache-from: ${{ steps.cache.outputs.from }}
          # zstd instead of the default gzip: "preparing build cache for
          # export" gzip-compresses every layer, and on the gpu-full leg
          # (~7 GB of CUDA/torch wheels) that alone took 327s of the 402s
          # cache-export step (run 390). zstd compresses those layers several
          # times faster; force-compression recompresses layers imported from
          # the old gzip cache so the blobs converge on zstd instead of
          # mixing.
          # The ref is per variant AND per producer (PR runs write their own
          # bucket) — see the "Compute buildx cache refs" step.
          cache-to: ${{ steps.cache.outputs.to }}

  # Kick mirror-ghcr.yml exactly once per publishing run, after every
  # variant has pushed. Replaces that workflow's registry_package trigger,
  # which fired once per pushed tag — ~12 runs per commit across the four
  # variants, because Forgejo's concurrency groups serialize an event
  # burst instead of deduping it. Dispatch is also the only trigger shape
  # that works from CI at all: Forgejo suppresses workflow events whose
  # actor is the actions token (cycle prevention), but the dispatch API
  # bypasses the event pipeline and accepts the run-scoped token.
  #
  # if: always() so this job runs whatever happened upstream — build is
  # deliberately *skipped* on main pushes (tag-first flow), and the
  # dispatch decisions live on the steps: the ghcr mirror fires only after
  # a successful publish (tag runs / manual dispatch), the auto-release
  # only after a green main-push test run.
  #
  # The continuous-release dispatch (second step): every green push to
  # main kicks release.yml with bump=patch, which mints the next v* tag →
  # which fires this workflow's tag run — the single image build per
  # release, baking the clean vX.Y.Z. Gated to main pushes, so the tag
  # run cannot re-dispatch — no cycle.
  mirror:
    name: dispatch ghcr mirror + auto-release
    if: always()
    needs: [all-ci, build]
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch mirror-ghcr.yml (publish runs only)
        if: needs.build.result == 'success' && github.event_name != 'pull_request'
        env:
          DISPATCH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # ref=main: picks which revision of mirror-ghcr.yml runs, nothing
        # else — the sync derives its tag list from the registry at
        # runtime, so tag-push runs dispatch main's copy too. A retried
        # POST can at worst double-dispatch; the sync is an idempotent
        # digest-compare and its concurrency group serializes the pair.
        run: |
          curl -fsS --retry 3 --retry-delay 5 --retry-connrefused --retry-all-errors \
            -X POST \
            -H "Authorization: token ${DISPATCH_TOKEN}" \
            -H "Content-Type: application/json" \
            --data '{"ref":"main"}' \
            "${GITHUB_SERVER_URL}/api/v1/repos/${GITHUB_REPOSITORY}/actions/workflows/mirror-ghcr.yml/dispatches"

      # Continuous versioning: every commit that reached main and tested
      # green becomes a patch release (the tag run then does the actual
      # image build — build is skipped on this run). release.yml owns all
      # the tag logic (bump compute, [skip release] opt-out, monotonicity,
      # idempotence) — this step only tells it WHICH commit passed. Main
      # pushes only: tag runs of this workflow must not re-dispatch (cycle),
      # and manual minor/major bumps go through release.yml's own
      # workflow_dispatch button. The dispatch API accepts the run-scoped
      # token (same as the mirror dispatch above); the PAT that release.yml
      # needs for the tag push itself lives there as RELEASE_TOKEN.
      - name: Dispatch release.yml (auto patch bump; green main pushes only)
        if: needs.all-ci.result == 'success' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          DISPATCH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -fsS --retry 3 --retry-delay 5 --retry-connrefused --retry-all-errors \
            -X POST \
            -H "Authorization: token ${DISPATCH_TOKEN}" \
            -H "Content-Type: application/json" \
            --data "{\"ref\":\"main\",\"inputs\":{\"bump\":\"patch\",\"sha\":\"${GITHUB_SHA}\"}}" \
            "${GITHUB_SERVER_URL}/api/v1/repos/${GITHUB_REPOSITORY}/actions/workflows/release.yml/dispatches"
