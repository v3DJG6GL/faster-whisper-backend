# Conventions shared with faster-whisper-frontend/ci.yml and
# nextcloud-fpm-nginx/build.yml:
#
#   * Actions are referenced unqualified (owner/repo@ref) and resolve against
#     the instance's local pull mirrors. REQUIRES app.ini [actions]
#     DEFAULT_ACTIONS_URL = https://forgejo.informethic.ch — without it,
#     unqualified refs fall back to code.forgejo.org. Before bumping any
#     @version, confirm the mirror has synced that tag (8h interval, or
#     "Synchronize now" in the mirror repo's settings).
#   * actions/setup-python is NOT mirrored, and it would download interpreter
#     builds from GitHub at runtime anyway. The Linux test leg runs in an
#     official python:<ver> container instead (job-level `container:`); the
#     full (non-slim) image ships git + build toolchain.
#   * python containers have no node, so JS actions (actions/checkout) can't
#     run there — the test legs check out manually with plain git and the
#     run-scoped actions token (the frontend's host-mode Windows legs use the
#     same pattern because actions/checkout's credential persistence breaks
#     in host mode).
#   * windows-latest runs on the self-hosted Windows VM runner (host mode,
#     label windows-latest:host — see forgejo-runner-windows/
#     windows-runner-setup.md) and builds a per-job venv from the SYSTEM
#     python. VM prerequisite (one-time, admin PowerShell):
#         .\setup-runner.ps1 -ToolchainOnly   (forgejo-runner-windows repo)
#     which choco-installs python, node and ffmpeg AND rewrites the nssm
#     AppEnvironmentExtra PATH (the service PATH is explicit, so a bare
#     `choco install` never reaches the runner — ffmpeg's shim lives in
#     C:\ProgramData\chocolatey\bin, which only the script puts on it)
#     and restarts the service. Until then this leg fails at "python not
#     found" or in "Verify system test tools".
#     node and ffmpeg are prerequisites, not conveniences: the suite's
#     `node --check` and real WebM/Opus guards SKIP themselves when the tool
#     is missing, so the leg would go green having checked neither. "Verify
#     system test tools" fails loudly instead; the Linux leg apt-installs
#     both into its container.
#   * Registry auth: a PAT (secrets.REGISTRY_USER / REGISTRY_TOKEN, scope
#     package:write — same secret pair as nextcloud-fpm-nginx).
#   * Buildx cache: type=registry on the Forgejo registry, per variant (so
#     cpu/gpu don't evict each other) and per producer — see the "Compute
#     buildx cache refs" step.
name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# Cancel superseded PR runs; push runs are kept (they publish images).
# Every v* tag run shares ONE group: each pushes :latest<suffix> per
# variant, so two overlapping tag runs (a manual minor on the auto patch's
# commit, a slow uncached gpu-full build) would race for latest and could
# leave it on the older release. Forgejo serializes a group (it never
# dedupes), so the second release simply builds after the first.
concurrency:
  group: ${{ startsWith(github.ref, 'refs/tags/v') && 'ci-release' || format('ci-{0}', github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # The instance host, spelled out once: it is both the container registry
  # and the git remote the manual checkouts fetch from (via a GIT_HOST step
  # env), so a rename is a one-line edit, not a literal that only fails
  # mid-fetch.
  REGISTRY: forgejo.informethic.ch
  # The Linux test legs run as root inside python:* job containers — that's
  # the whole environment, not a system Python worth protecting, so silence
  # pip's per-invocation "Running pip as the 'root' user" warning.
  PIP_ROOT_USER_ACTION: ignore

jobs:
  # What a pull request needs. Outputs 'true'
  # or 'false'; push, tag and dispatch runs, a diff that cannot be computed
  # and any change under .forgejo/ set both 'true'.
  #   suite — false only when EVERY changed file is a Dockerfile (Renovate's
  #           python base-digest PRs): the Linux leg then runs only the
  #           CI-config tests (they read the Dockerfiles), Windows is
  #           skipped. A deny-list, so a new path runs the whole suite.
  #   image — the PR builds the images only when something they are built
  #           from by name changed (Dockerfiles, requirements, .dockerignore).
  #           A code-only PR's build is the tag run after it merges.
  changes:
    name: changes
    runs-on: ubuntu-latest
    outputs:
      suite: ${{ steps.filter.outputs.suite }}
      image: ${{ steps.filter.outputs.image }}
    steps:
      - name: Checkout
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Select the jobs
        id: filter
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          every() { # <reason>
            echo "every job runs: $1"
            { echo "suite=true"; echo "image=true"; } | tee -a "$GITHUB_OUTPUT"
          }
          if [ "$EVENT" != pull_request ]; then
            every "$EVENT event"
            exit 0
          fi
          if [ -z "$BASE" ] || [ -z "$HEAD" ] || ! files=$(git diff --no-renames --name-only "$BASE...$HEAD"); then
            echo "::warning::cannot diff $BASE...$HEAD"
            every "no diff"
            exit 0
          fi
          suite=false image=false
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            case $f in
              .forgejo/*) every "$f changed"; exit 0 ;;
            esac
            case $f in
              Dockerfile | Dockerfile.gpu) ;;
              *) suite=true ;;
            esac
            case $f in
              Dockerfile | Dockerfile.gpu | .dockerignore | requirements*.txt) image=true ;;
            esac
          done <<< "$files"
          { echo "suite=$suite"; echo "image=$image"; } | tee -a "$GITHUB_OUTPUT"

  test:
    name: tests (ubuntu-latest py3.14)
    needs: [changes]
    # Skipped on v* tag runs: a tag is only ever minted for a commit that
    # already tested green (release.yml enforces it on both its paths), so
    # the tag run goes straight to the image build. Skipping a needed job
    # needs Forgejo >= v16 (server-side job `if`, PR #13030) — older
    # servers hang the run (forgejo#12937).
    if: ${{ !cancelled() && !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    # One leg, on the interpreter the images ship (python:3.14-slim) and the
    # installers require; windows (below) is a portability parity guard.
    #
    # /persistent/uv is the runner's shared download cache (interlinea's
    # docs/ops/ci.md "Download cache"; listed in the runner config's
    # container.valid_volumes): every wheel came from PyPI on every run
    # before. A runner without it drops the mount with a warning and the
    # job runs uncached. The cache is writable by every repo on this runner;
    # requirements*.txt carry no hashes, so a wheel planted there would be
    # installed — accepted, all of them are the owner's repos.
    container:
      image: python:3.14-trixie
      volumes:
        - /persistent/uv:/cache/uv
    env:
      UV_CACHE_DIR: /cache/uv
      # Another filesystem than the checkout: copy instead of hard-linking.
      UV_LINK_MODE: copy
      # The image's interpreter (/usr/local, not externally managed): the
      # container is the environment, there is no venv to build.
      UV_SYSTEM_PYTHON: "1"
    steps:
      # Manual checkout (no node here — see header). The run-scoped actions
      # token authenticates the fetch, so this works regardless of repo
      # visibility. Ref and token reach git through the step env instead of
      # being expanded into the script text: `git check-ref-format` permits
      # $ ( ) ` ; & | in a tag name, and this workflow triggers on v* tags.
      - name: Checkout
        env:
          GIT_REF: ${{ github.ref }}
          GIT_SHA: ${{ github.sha }}
          GIT_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The git host is the registry host (env.REGISTRY); mirror-ghcr.yml
          # derives it from GITHUB_SERVER_URL the same way.
          GIT_HOST: ${{ env.REGISTRY }}
        run: |
          # Fetch from the credentialed URL directly instead of `git remote
          # add`: that persists the token verbatim into .git/config, where any
          # later `git remote -v` or remote-echoing error puts it in the job
          # log. Matters most on the host-mode Windows leg below, whose
          # workspace is a real directory on a long-lived VM with no cleanup —
          # but keep both legs identical so the pattern does not drift back.
          url="https://x-access-token:${GIT_TOKEN}@${GIT_HOST}/${{ github.repository }}.git"
          git init -q .
          git -c protocol.version=2 fetch --no-tags --prune --no-recurse-submodules --depth=1 "$url" "$GIT_REF"
          # Test the run's own commit, never the ref's current tip: all-ci's
          # status lands on GIT_SHA and the mirror job releases GIT_SHA, but
          # main-push runs are serialized, so a queued run often starts after
          # a later push moved the ref — it would test the newer tree and
          # vouch for (and release) a commit it never ran. Fetch the sha
          # itself, or failing that enough of the ref's history to hold it.
          if [ "$(git rev-parse FETCH_HEAD)" != "$GIT_SHA" ]; then
            echo "::notice::$GIT_REF moved past $GIT_SHA since this run was queued; checking out the run's own commit"
            git -c protocol.version=2 fetch --no-tags --no-recurse-submodules --depth=1 "$url" "$GIT_SHA" \
              || git -c protocol.version=2 fetch --no-tags --no-recurse-submodules --depth=200 "$url" "$GIT_REF"
          fi
          git checkout -q --force "$GIT_SHA"
          # --force resets tracked files only. A no-op in this ephemeral
          # container, but the persistent Windows workspace below would carry
          # .coverage / __pycache__ / test-created dirs into the next run —
          # keep both legs identical so each starts from the commit's content.
          git clean -qffdx

      # python:<ver>-trixie ships neither node nor ffmpeg, and the suite does
      # not fail without them — it SKIPS its two real guards:
      # test_inline_scripts_parse (`node --check` over the inline <script>
      # blocks of /settings/pipeline, /quick-config and /settings) and the
      # WebM/Opus transport tests (the only ones decoding MediaRecorder-shaped
      # input). A silently skipped guard is not coverage, so install both.
      # Not for a Dockerfile-only PR: the CI-config tests need neither.
      - name: Install system test tools (node, ffmpeg)
        if: needs.changes.outputs.suite == 'true'
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends nodejs ffmpeg
          rm -rf /var/lib/apt/lists/*
          node --version
          ffmpeg -version | head -1

      # uv instead of pip: parallel downloads, and the wheels come from the
      # /persistent/uv cache (job header). Same minor as interlinea's jobs,
      # which share the cache.
      - name: Install dependencies (CPU base + test tools)
        run: |
          python -m pip install --no-cache-dir "uv>=0.12,<0.13"
          uv --version
          uv pip install -r requirements.txt -r requirements-dev.txt

      # Rules in ruff.toml. Linux leg only: the lint result does not depend
      # on the platform.
      - name: Lint (ruff)
        run: ruff check .

      # Coverage gate: a shortfall fails this leg, hence `all-ci`, hence
      # auto-merge and release publishing. Measured 2026-10-06 at 87% on
      # both Linux and Windows (run 1226); set 3 points lower so run-to-run
      # variance and the Windows leg's POSIX-only skips don't false-fail.
      # Raise this number as coverage grows — never lower it.
      # A fixed worker count, never -n auto: auto took all 80 CPUs of the
      # runner host per leg (shared with the Windows VM and other repos'
      # runs) and starved the wall-clock tests — probe deadlines, the GPU
      # gate's wait (runs 1642-1646). 24 here and 16 on Windows leave the
      # host half free; lower them if timing tests start failing.
      - name: Run tests (with coverage gate)
        if: needs.changes.outputs.suite == 'true'
        run: pytest -n 24 -q --cov-fail-under=84

      - name: Run the CI-config tests (Dockerfile-only change)
        if: needs.changes.outputs.suite != 'true'
        run: pytest -q --no-cov -p no:cacheprovider tests/test_ci_workflow_config.py

  # Windows portability parity guard — a single leg on the self-hosted VM
  # runner (host mode), using the system python (VM prerequisite in the
  # header). Steps mirror the frontend's windows legs: manual checkout,
  # `python -m` invocations (Scripts\ shims may lag the service PATH).
  test-windows:
    name: tests (windows-latest)
    needs: [changes]
    # Skipped on tag runs — see the `test` job — and on a Dockerfile-only PR
    # (the Linux leg runs the tests that read the Dockerfiles).
    if: ${{ !cancelled() && !startsWith(github.ref, 'refs/tags/') && needs.changes.outputs.suite == 'true' }}
    runs-on: windows-latest
    env:
      # The SYSTEM profile's uv cache (default location) persists on the VM;
      # copy, not hard links, so nothing a job does to its .venv can reach it.
      UV_LINK_MODE: copy
    steps:
      # Same env indirection as the Linux legs above, in PowerShell spelling:
      # host-mode `run:` steps default to pwsh (no `shell: bash` here), so the
      # step env is read as $env:NAME.
      - name: Checkout
        env:
          GIT_REF: ${{ github.ref }}
          GIT_SHA: ${{ github.sha }}
          GIT_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Same single-sourced host as the Linux leg (env.REGISTRY).
          GIT_HOST: ${{ env.REGISTRY }}
        run: |
          # No `git remote add`: see the Linux leg. This runner is host mode,
          # so .git/config survives the job on a persistent machine.
          $url = "https://x-access-token:${env:GIT_TOKEN}@${env:GIT_HOST}/${{ github.repository }}.git"
          git init -q .
          git -c protocol.version=2 fetch --no-tags --prune --no-recurse-submodules --depth=1 $url "$env:GIT_REF"
          # pwsh hands the runner only the LAST native exit code (see the
          # ffmpeg note below), and the persistent .git still holds the
          # previous run's FETCH_HEAD: an unchecked failed fetch would test
          # the old commit and go green.
          if ($LASTEXITCODE -ne 0) { Write-Output "::error::git fetch exited $LASTEXITCODE"; exit 1 }
          # The run's own commit, not the ref's tip — see the Linux leg.
          if ((git rev-parse FETCH_HEAD) -ne $env:GIT_SHA) {
            Write-Output "::notice::$env:GIT_REF moved past $env:GIT_SHA since this run was queued; checking out the run's own commit"
            git -c protocol.version=2 fetch --no-tags --no-recurse-submodules --depth=1 $url "$env:GIT_SHA"
            if ($LASTEXITCODE -ne 0) {
              git -c protocol.version=2 fetch --no-tags --no-recurse-submodules --depth=200 $url "$env:GIT_REF"
              if ($LASTEXITCODE -ne 0) { Write-Output "::error::git fetch of $env:GIT_SHA exited $LASTEXITCODE"; exit 1 }
            }
          }
          git checkout -q --force "$env:GIT_SHA"
          if ($LASTEXITCODE -ne 0) { Write-Output "::error::git checkout exited $LASTEXITCODE"; exit 1 }
          # The workspace is a real directory on a long-lived VM with no
          # cleanup, and --force resets tracked files only: without this,
          # .coverage / __pycache__ / dirs a test wrote under the repo root
          # survive into the next run and make the parity guard depend on
          # what ran before it.
          git clean -qffdx

      # The VM is provisioned by hand (header prerequisite), so assert the
      # tools the suite's guards need are on PATH. Missing, they only make
      # test_inline_scripts_parse and the WebM/Opus transport tests skip,
      # and the leg goes green having checked nothing.
      - name: Verify system test tools (node, ffmpeg)
        run: |
          $missing = @('node', 'ffmpeg') | Where-Object { -not (Get-Command $_ -ErrorAction SilentlyContinue) }
          if ($missing) {
            Write-Output "::error::not on the runner PATH: $($missing -join ', ') - run '.\setup-runner.ps1 -ToolchainOnly' from forgejo-runner-windows on the VM (workflow header); it installs the tool and rewrites the service PATH"
            exit 1
          }
          node --version
          # Not `ffmpeg -version | Select-Object -First 1`: -First stops the
          # pipeline after one line, ffmpeg dies on the closed pipe with a
          # non-zero exit, and pwsh hands that to the runner as the step's
          # result (run 660 attempt 2 failed right after printing the line).
          $ffmpegVersion = ffmpeg -version
          if ($LASTEXITCODE -ne 0) { Write-Output "::error::ffmpeg -version exited $LASTEXITCODE"; exit 1 }
          Write-Output $ffmpegVersion[0]

      # A venv per job, never the VM's system python: the runner takes
      # several jobs at once and they all saw ONE site-packages, so a
      # Renovate PR's install swapped packages under a concurrent main run
      # (run 1373: PR #103 replaced av 18.1 with 19.0 mid-suite, 238
      # failures on a green commit). Each job has its own workspace and the
      # checkout's `git clean -x` drops the last run's .venv, so the install
      # is fresh every time; uv's wheel cache in the SYSTEM profile keeps it
      # fast. uv runs from the venv and installs into it (--python). pwsh
      # only reports the LAST native exit code, hence a check after each
      # command.
      - name: Install dependencies (CPU base + test tools)
        run: |
          python -m venv .venv
          if ($LASTEXITCODE -ne 0) { Write-Output "::error::python -m venv exited $LASTEXITCODE"; exit 1 }
          .venv\Scripts\python -m pip install --disable-pip-version-check "uv>=0.12,<0.13"
          if ($LASTEXITCODE -ne 0) { Write-Output "::error::uv install exited $LASTEXITCODE"; exit 1 }
          .venv\Scripts\python -m uv pip install --python .venv\Scripts\python.exe -r requirements.txt -r requirements-dev.txt

      # 16 workers, never -n auto: this VM shares its host with the Linux leg
      # (see its test step).
      - name: Run tests (with coverage gate)
        run: .venv\Scripts\python -m pytest -n 16 -q --cov-fail-under=84

  # Single, stable status check to require in the branch protection: test
  # legs come and go, the required check name never changes. It fails
  # unless every leg has its expected verdict — success, or skipped only on
  # tag runs and (Windows) Dockerfile-only PRs — so Renovate automerge only
  # proceeds when the whole suite is green on all platforms.
  all-ci:
    name: all-ci
    if: always()
    needs: [changes, test, test-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Require all test legs to succeed
        run: |
          echo "changes=${{ needs.changes.result }} suite=${{ needs.changes.outputs.suite }} test=${{ needs.test.result }} test-windows=${{ needs.test-windows.result }}"
          # A failed filter leaves its outputs empty: never read that as
          # "nothing to test".
          test "${{ needs.changes.result }}" = "success"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            # Tag runs skip the suites (the tagged commit already tested
            # green — see the test job); "skipped" is the expected verdict
            # here, and anything else means the skip condition regressed.
            test "${{ needs.test.result }}" = "skipped"
            test "${{ needs.test-windows.result }}" = "skipped"
          else
            test "${{ needs.test.result }}" = "success"
            # Windows may only be skipped by the Dockerfile-only filter.
            if [ "${{ needs.changes.outputs.suite }}" = "false" ]; then
              test "${{ needs.test-windows.result }}" = "skipped"
            else
              test "${{ needs.test-windows.result }}" = "success"
            fi
          fi

  # Build (and, off PRs, publish) the container images. A main push runs
  # ONLY the test legs; its green verdict dispatches release.yml (see the
  # mirror job below), which mints the next v* tag, and that tag's run is
  # the single image build per release, baking the clean vX.Y.Z — no double
  # builds, no interim :latest with a describe-suffixed version. PRs build
  # without pushing, to validate the Dockerfiles, and only when they touch
  # the Dockerfiles, requirements or .dockerignore (changes.image). A
  # workflow_dispatch run builds and publishes sha tags (manual rebuild
  # escape hatch); on a v* tag it republishes that tag's vX/sha tags, and
  # :latest only when it is the newest v* tag (the "newest" step) — an old
  # release never takes latest back. The all-ci gate fronts every publish:
  # on tag runs it verifies the suites were skipped deliberately (the tagged
  # commit tested green on its main-push run).
  #
  # Four variants build in parallel from the same context:
  #   cpu      — Dockerfile      → :latest, :v*, :sha-<short>     (CPU-only base)
  #   gpu      — Dockerfile.gpu  → :latest-gpu, …                 (CUDA 12 / cuDNN 9
  #              wheels from requirements-gpu.txt)
  #   cpu-full — Dockerfile      → :latest-full, …                (INCLUDE_EXTRAS=1:
  #              everything that Dockerfile's INCLUDE_EXTRAS block installs —
  #              diarization/pyannote + music separation (audio-separator) +
  #              llama-cpp translation, plus apt ffmpeg and a build-and-purge
  #              gcc/g++ cycle. That block stays the source of truth.)
  #   gpu-full — Dockerfile.gpu  → :latest-gpu-full, …            (extras on the cu126
  #              torch index so ctranslate2's pip CUDA libs are shared)
  # The suffix is applied to every tag via metadata-action's flavor.suffix.
  build:
    name: build image (${{ matrix.variant }})
    needs: [changes, all-ci]
    if: ${{ !cancelled() && needs.all-ci.result == 'success' && (github.event_name != 'push' || startsWith(github.ref, 'refs/tags/')) && (github.event_name != 'pull_request' || needs.changes.outputs.image == 'true') }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: cpu
            dockerfile: Dockerfile
            suffix: ''
            extras: '0'
          - variant: gpu
            dockerfile: Dockerfile.gpu
            suffix: '-gpu'
            extras: '0'
          - variant: cpu-full
            dockerfile: Dockerfile
            suffix: '-full'
            extras: '1'
          - variant: gpu-full
            dockerfile: Dockerfile.gpu
            suffix: '-gpu-full'
            extras: '1'
    steps:
      # actions/checkout works here (unlike the test legs): the catthehacker
      # job image has node, and the host-mode credential bug doesn't apply
      # in container mode.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Full history + tags so `git describe` below can anchor the build
          # version to the newest v* tag (shallow default sees no tags).
          fetch-depth: 0

      # Registry repository paths must be lowercase, but the owner
      # (v3DJG6GL) is not. metadata-action lowercases its own refs, yet the
      # buildx cache-from/cache-to refs below pass through verbatim — an
      # upper-case ref fails the build ("repository name must be
      # lowercase"). Derive the full lowercase owner/repo path once, from
      # github.repository, so an owner or repo rename never needs an edit
      # here.
      - name: Compute image name (registry requires lowercase)
        id: img
        run: echo "name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      # The version baked into the image (build_info.py reads it from the
      # WHISPER_BUILD_VERSION env). Tag-anchored and bumps with every commit:
      # "v0.1.0" on a tagged build, "v0.1.0-3-g1a2b3c4" three commits later.
      # On tag runs the ref name is authoritative — `git describe` is
      # ambiguous when two lightweight tags share a commit (a manual minor
      # after the auto patch) and would bake the older one.
      - name: Compute build version (git describe)
        id: ver
        run: echo "version=$(if [ "$GITHUB_REF_TYPE" = tag ]; then echo "$GITHUB_REF_NAME"; else git describe --tags --always; fi)" >> "$GITHUB_OUTPUT"

      # Buildx cache refs, per variant AND per producer.
      #
      # Each PR writes its OWN bucket: one shared PR bucket let concurrent
      # PRs overwrite each other, so a release build's cache hit depended on
      # which PR exported last. Non-PR runs (tags, dispatch) write the main
      # bucket and, to reuse the work their PR already did, additionally read
      # the bucket of the PR named in the merge commit's subject — Renovate
      # squash-merges end in "(#76)". A missing bucket is not an error
      # (buildkit logs "failed to configure registry cache importer: not
      # found" and carries on). Stale buckets from abandoned PRs are the cost:
      # cache tags on the container package, deletable in the registry UI.
      - name: Compute buildx cache refs
        id: cache
        env:
          EVENT: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          IMAGE: ${{ env.REGISTRY }}/${{ steps.img.outputs.name }}
          VARIANT: ${{ matrix.variant }}
        run: |
          set -euo pipefail
          base="${IMAGE}:buildcache-${VARIANT}"

          scope=""
          if [ "$EVENT" = "pull_request" ]; then
            # github.event.pull_request.number is the documented field; fall
            # back to the ref (refs/pull/<n>/{head,merge}), then to a shared
            # "-pr-shared" bucket, so a payload shape difference never fails.
            n="$PR_NUMBER"
            [ -n "$n" ] || n=$(printf '%s' "$GITHUB_REF" | sed -n 's|^refs/pull/\([0-9]\+\)/.*|\1|p')
            scope="-pr-${n:-shared}"
          fi

          echo "to=type=registry,ref=${base}${scope},mode=max,ignore-error=true,compression=zstd,force-compression=true" >> "$GITHUB_OUTPUT"

          {
            echo "from<<CACHE_REFS"
            echo "type=registry,ref=${base}"
            if [ -n "$scope" ]; then
              echo "type=registry,ref=${base}${scope}"
            else
              merged=$(git log -1 --format=%s | sed -n 's|.*(#\([0-9]\+\))$|\1|p')
              if [ -n "$merged" ]; then
                echo "type=registry,ref=${base}-pr-${merged}"
              fi
            fi
            echo CACHE_REFS
          } >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4
        with:
          # Resolve docker.io refs (the python base image) via Google's
          # pull-through mirror — repeated PR/matrix builds otherwise eat
          # into Docker Hub's anonymous rate limit. buildkit falls back to
          # docker.io on a mirror miss, so this can only help.
          #
          # network=host puts the builder in the dind daemon's netns (same
          # as the job containers, per runner-config container.network).
          # Without it the builder sits on a dind bridge whose DNS falls
          # back to 8.8.8.8, resolves the instance's public WAN IP, and
          # hairpins all registry traffic (cache-from/push) through the LAN
          # firewall. In the dind netns it resolves via the outer embedded
          # DNS, which answers with the reverse proxy's container alias.
          driver-opts: network=host
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]

            [worker.oci]
              gc = true
              gckeepstorage = "50GB"

      # Needed on PRs too: the buildx cache lives on the Forgejo registry.
      - name: Log in to the Forgejo registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_TOKEN }}

      # A workflow_dispatch on an OLD v* tag (rebuilding a past release for a
      # base-image fix) skips the suites and publishes like a tag push — it
      # must not move :latest (and, through the mirror, ghcr's latest*) back
      # to that release: only the NEWEST v* tag may carry latest. ls-remote,
      # not just the checkout's tags, so a release minted while this run
      # queued still counts; the local tags are the fallback. Only strict
      # vX.Y.Z tags count (release.yml's own filter): a v1.2.3-rc1 or a
      # "vendor-x" would sort after every release under sort -V.
      - name: Is this the newest release tag?
        id: newest
        run: |
          set -euo pipefail
          refs=$(git ls-remote --tags --refs origin 'v*' 2>/dev/null) \
            || refs=$(git show-ref --tags || true)
          newest=$(printf '%s\n' "$refs" \
            | sed -n 's#.*refs/tags/\(v.*\)$#\1#p' \
            | { grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' || true; } \
            | sort -V | tail -n 1)
          is_newest=false
          if [ "$GITHUB_REF_TYPE" = tag ] && [ -n "$newest" ] \
              && [ "$GITHUB_REF_NAME" = "$newest" ]; then
            is_newest=true
          fi
          echo "newest v* tag: ${newest:-none}; this ref: ${GITHUB_REF_NAME} → latest: ${is_newest}"
          echo "is_newest=${is_newest}" >> "$GITHUB_OUTPUT"

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ steps.img.outputs.name }}
          # latest=false: the type=raw rule below owns `latest` — tag runs
          # only, and only for the newest v* tag (the "newest" step), so it
          # always carries a clean vX.Y.Z. A [skip release] commit gets no
          # tag and so publishes no images. onlatest=true: the variant
          # suffix reaches the raw `latest` tag too.
          flavor: |
            latest=false
            suffix=${{ matrix.suffix }},onlatest=true
          tags: |
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && steps.newest.outputs.is_newest == 'true' }}
            type=ref,event=tag
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILD_VERSION=${{ steps.ver.outputs.version }}
            INCLUDE_EXTRAS=${{ matrix.extras }}
          # Attestation manifests have a spotty history with Forgejo
          # registries — off until verified on this instance.
          provenance: false
          sbom: false
          # zstd image layers via `outputs`, not `push:` (both are the same
          # --output flag; they cannot both be set). Matching the zstd build
          # cache lets buildkit reuse a cached blob as-is instead of re-gzipping
          # every layer at export (~700 s on gpu-full, even unchanged layers).
          # No force-compression: base-image layers stay gzip, so they keep
          # deduplicating against other python:3.14-slim images in the registry.
          # COMPATIBILITY: every host that pulls these images needs Docker >= 23,
          # containerd >= 1.5, or a current podman.
          outputs: type=image,push=${{ github.event_name != 'pull_request' }},compression=zstd,oci-mediatypes=true
          # cache-to deliberately lives in the separate step below — see there.
          cache-from: ${{ steps.cache.outputs.from }}

      # Cache export runs as its own buildx invocation, AFTER the push above:
      # in one invocation buildkit pushes image layers and exports the cache
      # concurrently, so a layer new to the registry is uploaded twice at once.
      # Forgejo's GetOrInsertBlob (SELECT-then-INSERT, no upsert) then trips
      # the UQE_package_blob_blake2b unique index and nil-derefs the server;
      # buildx reports only "failed to push …: unknown". Everything is cached
      # locally by now, so this step costs seconds; ignore-error keeps a
      # transient cache-push failure from failing an already-published image.
      - name: Export build cache
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          build-args: |
            BUILD_VERSION=${{ steps.ver.outputs.version }}
            INCLUDE_EXTRAS=${{ matrix.extras }}
          provenance: false
          sbom: false
          cache-from: ${{ steps.cache.outputs.from }}
          # The `to` ref (see "Compute buildx cache refs") exports zstd: gzip
          # of the ~7 GB gpu-full CUDA/torch layers was most of this step's
          # time. force-compression recompresses layers imported from the old
          # gzip cache so the blobs converge on zstd instead of mixing.
          cache-to: ${{ steps.cache.outputs.to }}

  # Kick mirror-ghcr.yml exactly once per publishing run, after every
  # variant has pushed (see mirror-ghcr.yml's header for why not a
  # registry_package trigger). Dispatch is also the only trigger shape that
  # works from CI: Forgejo suppresses workflow events whose actor is the
  # actions token (cycle prevention), but the dispatch API bypasses the
  # event pipeline and accepts the run-scoped token.
  #
  # if: always() because build is deliberately *skipped* on main pushes;
  # the step conditions decide: the ghcr mirror fires only after a
  # successful publish (tag runs / manual dispatch), the auto-release only
  # after a green main-push test run.
  mirror:
    name: dispatch ghcr mirror + auto-release
    if: always()
    needs: [all-ci, build]
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch mirror-ghcr.yml (publish runs only)
        if: needs.build.result == 'success' && github.event_name != 'pull_request'
        env:
          DISPATCH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # ref=main: picks which revision of mirror-ghcr.yml runs, nothing
        # else — the sync derives its tag list from the registry at
        # runtime, so tag-push runs dispatch main's copy too. `sha` names
        # the commit this run published, so its sha-* tags get the digest
        # compare even when ghcr already has them (a branch rebuild
        # re-pushes only those; see mirror-ghcr.yml's header). A retried
        # POST can at worst double-dispatch; the sync is an idempotent
        # digest-compare and its concurrency group serializes the pair.
        run: |
          curl -fsS --retry 3 --retry-delay 5 --retry-connrefused --retry-all-errors \
            -X POST \
            -H "Authorization: token ${DISPATCH_TOKEN}" \
            -H "Content-Type: application/json" \
            --data "{\"ref\":\"main\",\"inputs\":{\"sha\":\"${GITHUB_SHA}\"}}" \
            "${GITHUB_SERVER_URL}/api/v1/repos/${GITHUB_REPOSITORY}/actions/workflows/mirror-ghcr.yml/dispatches"

      # Every green main push becomes a patch release. release.yml owns all
      # the tag logic (bump compute, [skip release] opt-out, monotonicity,
      # idempotence) — this step only tells it WHICH commit passed. Main
      # pushes only: a tag run must not re-dispatch (cycle). The dispatch API
      # accepts the run-scoped token; the PAT release.yml needs for the tag
      # push itself lives there as RELEASE_TOKEN.
      - name: Dispatch release.yml (auto patch bump; green main pushes only)
        if: needs.all-ci.result == 'success' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          DISPATCH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -fsS --retry 3 --retry-delay 5 --retry-connrefused --retry-all-errors \
            -X POST \
            -H "Authorization: token ${DISPATCH_TOKEN}" \
            -H "Content-Type: application/json" \
            --data "{\"ref\":\"main\",\"inputs\":{\"bump\":\"patch\",\"sha\":\"${GITHUB_SHA}\"}}" \
            "${GITHUB_SERVER_URL}/api/v1/repos/${GITHUB_REPOSITORY}/actions/workflows/release.yml/dispatches"
