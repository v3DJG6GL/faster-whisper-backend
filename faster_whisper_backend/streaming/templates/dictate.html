<!doctype html>
<!--
  Live dictation page for /v1/audio/transcriptions/stream.

  Rendered through web_common.render_page (NOT served as a plain static file),
  so it carries the same header, nav, scale picker, severity pills and sign-out
  as every other WebUI page and the double-brace placeholders below are
  substituted server-side.

  Auth: the session cookie the rest of the WebUI already uses. There is no API
  key field and no server field — the page talks to the origin that served it,
  the browser attaches the cookie to both the WebSocket handshake and the batch
  POST, and a signed-out visitor gets the shared login gate like anywhere else.

  Audio: captures the mic via an AudioWorklet, downsamples to 16 kHz mono s16le
  PCM, streams it over the WebSocket, and renders LocalAgreement stabilized
  partials (committed bold + provisional faded) plus append-only finals.
  Self-contained — no CDNs.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{HEADER_TITLE}}</title>
{{PAGE_META}}
{{SCALE_BOOTSTRAP_HEAD}}
<style>
  :root {
    --bg: #0d1117;
    --panel: #161b22;
    --fg: #c9d1d9;
    --dim: #6e7681;
    --help: #8b949e;
    --bold: #f0f6fc;
    --cyan: #79c0ff;
    --green: #7ee787;
    --yellow: #f2cc60;
    --red: #ff7b72;
    --border: #30363d;
    --input-bg: #0d1117;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  /* Chrome is sans like every other page — the shared header inherits the
     body font, and mono at 1rem is wide enough to wrap the nav row. The
     transcript (#doc) and code snippets opt back into mono below. Subbar
     controls come entirely from NAV_CSS; no local overrides. */
  body {
    background: var(--bg); color: var(--fg);
    font: 1rem/1.5 var(--font-sans);
    display: flex; flex-direction: column; min-height: 100%;
  }
  input, textarea, select, kbd, code, pre { font-family: var(--font-mono); }

  main { flex: 1; padding: 1.25rem var(--gutter); overflow: auto; width: 100%; max-width: var(--col); margin-inline: auto; box-sizing: border-box; }
  #doc {
    white-space: pre-wrap; word-break: break-word; line-height: 1.65;
    font: var(--fs-lg)/1.65 var(--font-mono); min-height: 6rem; max-width: 60rem;
  }
  #final { color: var(--fg); }        /* committed: locked, append-only */
  #tail { color: var(--help); }       /* provisional: may still firm up */
  #partial { color: var(--dim); }
  #partial .committed { color: var(--fg); }
  #partial .pending { color: var(--dim); opacity: 0.6; font-style: italic; }

  footer {
    padding: 0.6rem 1.25rem; border-top: 1px solid var(--border);
    font-size: var(--fs-sm); color: var(--help);
  }
  footer code {
    font-family: var(--font-mono); color: var(--cyan);
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 3px; padding: 0 0.3em;
  }
  #note { margin-top: 0.4rem; color: var(--dim); }

  {{NAV_CSS}}

  /* Status states on top of the shared dim #status rule. These MUST sit
     AFTER NAV_CSS: its `header .subbar #status:not(.pill)` rule has the
     same specificity (0,1,2,1 -- :not() takes its argument's), so source
     order decides; placed before NAV_CSS the live/error colours lose and
     the status text stays --dim forever. */
  header .subbar #status.live { color: var(--green); }
  header .subbar #status.error { color: var(--red); }
</style>
</head>
<body class="{{PAGE_CLASS}}">
<header>
  <div class="header-inner">
    <span class="title">{{HEADER_BRAND}}</span>{{HEADER_VTAG}}
    <span class="brand-sep" aria-hidden="true"></span>
    {{NAV}}
    <span class="spacer"></span>
    <span class="hdr-right">{{SEV_PILLS}}{{SCALE_PICKER}}{{RELOAD}}{{LOGOUT}}</span>
  </div>
  <div class="subbar">
    <span class="subbar-title">Dictate</span>
    <div class="subbar-left">
      <label>mode
        <select id="mode" title="Streaming: live partials over a WebSocket. Batch: record, then POST the whole clip to /v1/audio/transcriptions (one-shot, full pipeline).">
          <option value="stream">streaming (live)</option>
          <option value="batch">batch (record &amp; send)</option>
        </select>
      </label>
      <label>model <input type="text" id="model" value="whisper-1" size="13"></label>
      <label>lang <input type="text" id="lang" value="de" size="3"></label>
      <label>format
        <select id="format">
          <option value="json">json</option>
          <option value="verbose_json">verbose_json</option>
        </select>
      </label>
      <button id="toggle">Start dictation</button>
      <span id="status">idle</span>
    </div>
  </div>
</header>
<main>
  <div id="doc"><span id="final"></span><span id="tail"></span><span id="partial"></span></div>
</main>
<footer>
  Speak commands: <code>Punkt</code> &rarr; . &nbsp; <code>Komma</code> &rarr; , &nbsp;
  <code>neue Zeile</code> &rarr; newline &nbsp; <code>Klammer auf/zu</code> &rarr; ( )
  <div id="note"></div>
</footer>

{{SCALE_PICKER_JS}}
{{SEV_POLLER_JS}}
<script>
(() => {
  "use strict";
  const TARGET_SR = 16000;
  const FRAME_SAMPLES = 4096;           // ~256 ms per WS binary frame at 16 kHz
  const $ = (id) => document.getElementById(id);
  const finalEl = $("final"), tailEl = $("tail"), partialEl = $("partial"),
        statusEl = $("status"), toggleBtn = $("toggle");

  let ws = null, audioCtx = null, workletNode = null, mediaStream = null, running = false;
  let stopTimer = null;   // fallback if the server never answers "stop" with "closing"
  // After Stop the server drains its backlog and runs a forced final decode
  // before "closing"; every frame it sends re-arms the wait, and the decode
  // itself (announced by utterance "decoding") gets the long window.
  const STOP_WAIT_MS = 10000, STOP_DECODE_WAIT_MS = 60000;
  // The current utterance's last announced state ("open" / "decoding"), null
  // once it got its final or was dropped. A decode announced BEFORE Stop sends
  // nothing until it finishes, so stop() itself must pick the long window.
  let uttState = null;
  // Bumped by every Start. A start() / startBatch() still awaiting the mic or
  // the worklet was cancelled when Stop ran (running is false) or a newer Start
  // began (the generation moved on); it then drops what it acquired and leaves
  // the page alone.
  let startGen = 0;
  const cancelled = (gen) => gen !== startGen || !running;
  let resampleCarry = 0.0, resamplePos = 0.0, pcmBuf = new Int16Array(FRAME_SAMPLES), pcmLen = 0;
  let docPrefix = "";     // finished documents (before a hard break), see "boundary"
  // Batch mode: record the whole clip with MediaRecorder, POST it in one shot.
  let recorder = null, recStream = null, recChunks = [];

  function setStatus(text, cls) { statusEl.textContent = text; statusEl.className = cls || ""; }
  const mode = () => $("mode").value;

  // This page is served by the backend it talks to, so both transports target
  // the page's own origin and the session cookie rides along automatically —
  // no key field, no server field, no CORS. A remote backend is reached by
  // opening ITS /dictate, which is also where its credentials live.
  const wsBase = () =>
    (location.protocol === "https:" ? "wss" : "ws") + "://" + location.host;

  // Settings persisted per browser. The credential is the session cookie, so
  // there has never been anything secret to keep out of this blob — but an
  // older build of this page did store an API key here, hence the cleanup.
  const PREF_FIELDS = ["mode", "model", "lang", "format"];

  function loadPrefs() {
    let saved = {};
    try { saved = JSON.parse(localStorage.getItem("dictatePrefs") || "{}"); } catch {}
    for (const f of PREF_FIELDS) if (saved[f] != null && $(f)) $(f).value = saved[f];
    if (saved.key != null || saved.server != null) savePrefs();
  }
  function savePrefs() {
    const o = {};
    for (const f of PREF_FIELDS) if ($(f)) o[f] = $(f).value;
    try { localStorage.setItem("dictatePrefs", JSON.stringify(o)); } catch {}
  }

  // AudioWorklet processor: forward raw Float32 mic frames to the main thread.
  const workletSrc = `
    class Cap extends AudioWorkletProcessor {
      process(inputs) {
        const ch = inputs[0][0];
        if (ch) this.port.postMessage(ch.slice(0));
        return true;
      }
    }
    registerProcessor('cap', Cap);
  `;

  // Linear-resample incoming Float32 (at ctxRate) down to TARGET_SR, pack to
  // int16, and ship full frames as WS binary.
  function pushSamples(float32, srcRate) {
    if (!float32.length) return;
    const ratio = srcRate / TARGET_SR;
    // pos is relative to index -1 == resampleCarry (the previous block's last
    // sample), so a seam point always interpolates between two REAL neighbours.
    // Using the carry as the RIGHT neighbour of the last sample (an older build)
    // reached 128 samples into the past at every block seam — inaudible at
    // 48 kHz (ratio 3, seams land on integers) but a ~124 Hz click train at
    // 44.1 kHz, the default capture rate on most Apple hardware.
    let pos = resamplePos;
    while (pos < float32.length - 1) {
      const i = Math.floor(pos);
      const frac = pos - i;
      const a = i < 0 ? resampleCarry : float32[i];
      const b = float32[i + 1];
      let s = a + (b - a) * frac;
      s = Math.max(-1, Math.min(1, s));
      pcmBuf[pcmLen++] = s < 0 ? s * 0x8000 : s * 0x7fff;
      if (pcmLen === FRAME_SAMPLES) {
        if (ws && ws.readyState === 1) ws.send(pcmBuf.buffer.slice(0));
        pcmLen = 0;
      }
      pos += ratio;
    }
    resampleCarry = float32[float32.length - 1];
    resamplePos = pos - float32.length;
  }

  function renderPartial(committed, pending) {
    partialEl.textContent = "";
    const c = document.createElement("span"); c.className = "committed"; c.textContent = committed || "";
    const p = document.createElement("span"); p.className = "pending"; p.textContent = pending || "";
    partialEl.append(c, p);
  }

  function onMessage(ev) {
    let m; try { m = JSON.parse(ev.data); } catch { return; }
    if (stopTimer) armStopTimer(STOP_WAIT_MS);
    // Stop during a cold model load: "ready" arrives after the mic is already
    // released, so it must not put "listening" over "finishing…".
    if (m.type === "ready") {
      if (running && statusEl.className !== "error") setStatus("listening", "live");
    }
    else if (m.type === "partial") { renderPartial(m.committed, m.pending); }
    else if (m.type === "final") {
      // committed = locked prefix; tail = the newest sentence (a display hint —
      // the document only grows, nothing sent is rewritten). A release final
      // (flush: true, no utterance) carries words the server held back. Both
      // are full strings (server re-sends them), so we replace, not append.
      // They span only the CURRENT document (since the last hard break),
      // hence docPrefix.
      finalEl.textContent = docPrefix + (m.committed || "");
      tailEl.textContent = m.tail || "";
      renderPartial("", "");
      uttState = null;
      // A final is the terminal frame of the utterance that showed
      // "transcribing…" below. Only while running: after Stop the status is
      // "finishing…" and the drain's finals must not put "listening" back.
      // Nor over an error: every server error frame is terminal, and the
      // closing drain (idle timeout) still sends a final after it.
      if (running && statusEl.className !== "error") setStatus("listening", "live");
    }
    else if (m.type === "utterance") {
      // Lifecycle of the utterance the server is holding. "decoding" = it heard
      // the end of the phrase and is running the final decode — without this the
      // page said "listening" through the whole decode, as if nothing was
      // happening. "dropped" = it ended with no text (noise); back to listening.
      // No final follows a dropped utterance, so its partial would stay faded on
      // screen — words that never reach the document. Clearing it is harmless
      // after Stop too, so it runs before the guard.
      // Unknown states are ignored on purpose (the server may grow more).
      if (m.state === "dropped") renderPartial("", "");
      // Only the known states move uttState: an unknown one arriving after
      // "decoding" must not cut Stop's long decode window to STOP_WAIT_MS.
      if (m.state === "dropped") uttState = null;
      else if (m.state === "open" || m.state === "decoding") uttState = m.state;
      // After Stop the forced final decode may take far longer than a frame
      // gap (large-v3 on CPU): give the fallback the long window.
      if (stopTimer && m.state === "decoding") armStopTimer(STOP_DECODE_WAIT_MS);
      if (!running || statusEl.className === "error") return;
      if (m.state === "decoding") setStatus("transcribing…", "live");
      else if (m.state === "dropped") setStatus("listening", "live");
    }
    else if (m.type === "boundary") {
      // Hard break (STREAMING_HARD_BREAK_SILENCE_MS of silence): the server
      // starts a fresh document, so the next final's committed/tail no longer
      // cover what is on screen — fold the finished document into a prefix the
      // final handler keeps re-rendering, or everything before the pause would
      // vanish the moment the user resumes speaking.
      docPrefix = finalEl.textContent + tailEl.textContent;
      // `||` on purpose: the separator is what a TYPING client inserts between
      // documents, and its default is "" — on this preview page that would run
      // the two documents together, so an empty one shows as a line break.
      // A configured output suffix arrives in front of the separator (and on
      // its own as m.suffix): strip it first, or it alone would defeat the `||`.
      const suf = m.suffix || "";
      const sep = (m.separator || "").slice(suf.length);
      if (docPrefix) docPrefix += suf + (sep || "\n");
      finalEl.textContent = docPrefix; tailEl.textContent = "";
    }
    else if (m.type === "loading") {
      // Sent every ~3 s while a cold model load is in progress — without it the
      // page sits on "connecting…" for the whole load and reads as dead.
      // Same guard as "ready": after Stop the load keeps sending these, and
      // they must not put "loading model" over "finishing…" or an error.
      if (running && statusEl.className !== "error") {
        setStatus("loading model " + (m.model || "") + "…");
      }
    }
    else if (m.type === "error") { setStatus("error: " + (m.message || m.code), "error"); }
    else if (m.type === "closing") {
      // Also the server's own close (idle timeout) while the mic still runs:
      // release it, and keep a preceding error frame's text on screen.
      const hadError = statusEl.className === "error";
      const prevText = statusEl.textContent;
      releaseMic();
      finishStop();
      if (hadError) setStatus(prevText, "error");
    }
  }

  function idleLabel() { return mode() === "batch" ? "Record" : "Start dictation"; }
  function resetToggleButton() {
    toggleBtn.disabled = false;
    $("mode").disabled = false;
    toggleBtn.textContent = idleLabel();
    toggleBtn.classList.remove("danger");
  }

  // --- batch mode: record with MediaRecorder, POST the whole clip ---------------
  function pickMime() {
    const cands = ["audio/webm;codecs=opus", "audio/webm", "audio/ogg;codecs=opus", "audio/mp4"];
    for (const c of cands) {
      try { if (window.MediaRecorder && MediaRecorder.isTypeSupported(c)) return c; } catch {}
    }
    return "";
  }

  async function startBatch(gen) {
    finalEl.textContent = ""; tailEl.textContent = ""; renderPartial("", "");
    recChunks = [];
    const stream = await navigator.mediaDevices.getUserMedia({ audio: { channelCount: 1, echoCancellation: true, noiseSuppression: true } });
    // Stop pressed while the permission prompt was open: stopBatch() already
    // reset the page, so release this mic instead of recording into nothing.
    if (cancelled(gen)) { stream.getTracks().forEach((t) => t.stop()); return; }
    recStream = stream;
    try {
      const mime = pickMime();
      recorder = mime ? new MediaRecorder(recStream, { mimeType: mime }) : new MediaRecorder(recStream);
      recorder.ondataavailable = (e) => { if (e.data && e.data.size) recChunks.push(e.data); };
      recorder.onstop = () => { sendBatch(); };
      recorder.start();
    } catch (err) {
      // No MediaRecorder, or start() refused: the click handler's catch only
      // resets the page, so release the live mic here or it stays on.
      stream.getTracks().forEach((t) => t.stop());
      recStream = null; recorder = null;
      throw err;
    }
    setStatus("recording… (press Stop to transcribe)", "live");
  }

  function stopBatch() {
    if (recStream) recStream.getTracks().forEach((t) => t.stop());
    if (recorder && recorder.state !== "inactive") {
      toggleBtn.disabled = true;
      setStatus("transcribing…");
      try { recorder.stop(); } catch {}
    } else {
      running = false;
      recorder = null; recStream = null; recChunks = [];
      resetToggleButton();
      setStatus("idle");
    }
  }

  async function sendBatch() {
    try {
      const type = (recorder && recorder.mimeType) || "audio/webm";
      const blob = new Blob(recChunks, { type });
      recorder = null;
      if (!blob.size) { setStatus("no audio recorded", "error"); return; }
      const ext = type.includes("ogg") ? "ogg" : (type.includes("mp4") ? "mp4" : "webm");
      const fd = new FormData();
      fd.append("file", blob, "dictation." + ext);
      fd.append("model", $("model").value.trim() || "whisper-1");
      const lang = $("lang").value.trim(); if (lang) fd.append("language", lang);
      fd.append("response_format", $("format").value || "json");
      // Same origin, so the session cookie authenticates this POST. The CSRF
      // middleware wants the double-submit header on a cookie-authenticated
      // unsafe method; the shared chrome keeps window._csrfToken current.
      const headers = {};
      const csrf = typeof window._csrfToken === "function" ? window._csrfToken() : "";
      if (csrf) headers["X-CSRF-Token"] = csrf;
      const resp = await fetch("/v1/audio/transcriptions", {
        method: "POST", headers, body: fd, credentials: "same-origin",
      });
      if (!resp.ok) {
        setStatus("batch error " + resp.status + ": " + (await resp.text()).slice(0, 200), "error");
        return;
      }
      const ct = resp.headers.get("content-type") || "";
      let text;
      if (ct.includes("application/json")) {
        const j = await resp.json();
        text = (j && j.text != null) ? j.text : JSON.stringify(j, null, 2);
      } else {
        text = await resp.text();
      }
      finalEl.textContent = text || "";
      tailEl.textContent = ""; renderPartial("", "");
      setStatus("done", "live");
    } catch (err) {
      setStatus("batch failed: " + err.message, "error");
    } finally {
      running = false;
      if (recStream) { recStream.getTracks().forEach((t) => t.stop()); recStream = null; }
      resetToggleButton();
    }
  }

  // Tear down what ONE start() acquired, by reference: once that start is
  // cancelled the globals may already belong to a newer session.
  function dropStart(sock, stream, ctx) {
    try { if (sock) { sock.onopen = sock.onmessage = sock.onclose = sock.onerror = null; sock.close(); } } catch {}
    try { if (stream) stream.getTracks().forEach((t) => t.stop()); } catch {}
    try { if (ctx && ctx.state !== "closed") ctx.close(); } catch {}
  }

  async function start(gen) {
    finalEl.textContent = ""; tailEl.textContent = ""; renderPartial("", ""); docPrefix = "";
    uttState = null;
    setStatus("requesting mic…");

    // Acquire mic BEFORE opening the WebSocket so a denied permission
    // never wastes a server-side streaming session.
    const stream = await navigator.mediaDevices.getUserMedia({ audio: { channelCount: 1, echoCancellation: true, noiseSuppression: true } });
    // Stop pressed while the permission prompt was open: stop() already reset
    // the page, so do not open a socket (a server slot) nobody will close.
    if (cancelled(gen)) { dropStart(null, stream, null); return; }
    mediaStream = stream;

    const base = wsBase();
    const sock = ws = new WebSocket(base + "/v1/audio/transcriptions/stream");
    sock.binaryType = "arraybuffer";
    setStatus("connecting…");

    sock.onopen = () => {
      sock.send(JSON.stringify({
        type: "config", model: $("model").value.trim() || "whisper-1",
        language: $("lang").value.trim() || null,
        response_format: $("format").value || "json",
        audio: { format: "pcm_s16le", sample_rate: TARGET_SR },
      }));
    };
    sock.onmessage = onMessage;
    sock.onerror = () => setStatus("socket error", "error");
    sock.onclose = (ev) => {
      // Captured BEFORE stop()/finishStop(): both end in setStatus("idle"), which
      // would wipe an {"type":"error"} frame's text that preceded this close.
      const hadError = statusEl.className === "error";
      const prevText = statusEl.textContent;
      if (running) stop(); else finishStop();
      if (ev && ev.code === 4401) setStatus("signed out — reload to sign in again", "error");
      else if (ev && ev.code === 4403) setStatus("handshake rejected (origin)", "error");
      else if (ev && ev.code === 4503) setStatus("live dictation is disabled on this server", "error");
      else if (ev && ev.code === 4429) setStatus("too many live sessions — try again later", "error");
      else if (ev && ev.code === 4408) setStatus("closed: no audio for a while", "error");
      else if (hadError) setStatus(prevText, "error");
      else setStatus("closed");
    };

    let ctx = null;
    try {
      ctx = audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const blobUrl = URL.createObjectURL(new Blob([workletSrc], { type: "application/javascript" }));
      await ctx.audioWorklet.addModule(blobUrl);
      // A refusal close (4401/4403/4429/4503) can land during that await:
      // onclose -> stop() already released everything and put its message
      // up, so build no graph and leave the status alone. A Stop pressed
      // during it sent "stop" on the still-open socket and armed the stop
      // timer; dropStart detaches the handlers that "closing" would have
      // reached, so finish that stop here (only if this socket is still ws).
      if (cancelled(gen)) { dropStart(sock, stream, ctx); if (ws === sock) finishStop(); return; }
      const src = ctx.createMediaStreamSource(stream);
      const node = workletNode = new AudioWorkletNode(ctx, "cap");
      const sr = ctx.sampleRate;
      node.port.onmessage = (e) => { if (!cancelled(gen)) pushSamples(e.data, sr); };
      src.connect(node);
      const sink = ctx.createGain(); sink.gain.value = 0; node.connect(sink); sink.connect(ctx.destination);
    } catch (err) {
      dropStart(sock, stream, ctx);
      if (cancelled(gen)) { if (ws === sock) finishStop(); return; }
      ws = null; audioCtx = null; workletNode = null; mediaStream = null;
      throw err;
    }
  }

  function finishStop() {
    if (stopTimer) { clearTimeout(stopTimer); stopTimer = null; }
    try { if (ws) { ws.onmessage = ws.onclose = ws.onerror = null; ws.close(); } } catch {}
    ws = null; pcmLen = 0; resamplePos = 0; resampleCarry = 0.0; uttState = null;
    resetToggleButton();
    setStatus("idle");
  }

  function releaseMic() {
    running = false;
    if (mediaStream) mediaStream.getTracks().forEach((t) => t.stop());
    if (audioCtx) audioCtx.close();
    audioCtx = null; workletNode = null; mediaStream = null;
  }

  // The server never answered: the end of the dictation may be missing, so
  // say so instead of a plain "idle".
  function stopFallback() {
    finishStop();
    setStatus("finished without the server's last answer — the end may be missing", "error");
  }
  function armStopTimer(ms) {
    if (stopTimer) clearTimeout(stopTimer);
    stopTimer = setTimeout(stopFallback, ms);
  }

  function stop() {
    releaseMic();
    // The server emits the held final + the last document AFTER "stop" and
    // closes the socket itself after {"type":"closing"} — so keep onmessage
    // attached and the socket open until then; the timer is only a fallback
    // if it never answers (onMessage re-arms it on every frame).
    if (ws && ws.readyState === 1) {
      // Ship the partly filled frame too (up to ~256 ms, usually the end of
      // the last word): only full frames go out while recording, and the
      // server takes a binary frame of any length.
      if (pcmLen > 0) {
        try { ws.send(pcmBuf.buffer.slice(0, pcmLen * 2)); } catch {}
        pcmLen = 0;
      }
      try { ws.send(JSON.stringify({ type: "stop" })); } catch { finishStop(); return; }
      toggleBtn.disabled = true;
      setStatus("finishing…");
      armStopTimer(uttState === "decoding" ? STOP_DECODE_WAIT_MS : STOP_WAIT_MS);
    } else {
      finishStop();
    }
  }

  toggleBtn.addEventListener("click", async () => {
    const batch = mode() === "batch";
    if (running) { batch ? stopBatch() : stop(); return; }
    const gen = ++startGen;
    try {
      running = true;
      $("mode").disabled = true;
      toggleBtn.textContent = batch ? "Stop & transcribe" : "Stop";
      toggleBtn.classList.add("danger");
      await (batch ? startBatch(gen) : start(gen));
    } catch (err) {
      // Stop (or a newer Start) already owns the page: a denied prompt that
      // was cancelled anyway must not overwrite its status.
      if (cancelled(gen)) return;
      running = false;
      setStatus((batch ? "mic/record failed: " : "mic/socket failed: ") + err.message, "error");
      resetToggleButton();
    }
  });

  // Switching mode while idle just relabels the button (Start dictation ⇄ Record).
  $("mode").addEventListener("change", () => { if (!running) resetToggleButton(); });

  // --- init: restore saved settings, persist on change, warn on insecure context ---
  loadPrefs();
  resetToggleButton();   // reflect the restored mode (Start dictation / Record)
  PREF_FIELDS.forEach((f) => { const el = $(f); if (el) el.addEventListener("change", savePrefs); });
  if (!window.isSecureContext) {
    const n = $("note");
    n.textContent = "⚠ Microphone needs a secure context (https or localhost). "
      + "Open this page over https, or from localhost.";
    n.style.color = "var(--red)";
  } else {
    $("note").textContent = "Settings are saved in this browser. Batch mode records the "
      + "clip and POSTs it to /v1/audio/transcriptions in one shot (full pipeline); "
      + "streaming mode shows live partials over a WebSocket.";
  }
})();
</script>
</body>
</html>
