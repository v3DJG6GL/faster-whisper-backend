[pytest]
# Tests live under tests/. `pythonpath = .` puts the repo root on sys.path so
# the application modules import the same way under `pytest` (Linux CI) and
# `python -m pytest` (Windows CI).
testpaths = tests
pythonpath = .
python_files = test_*.py
# Coverage scope (the package + the yt-dlp SSRF guard plugin) lives in
# .coveragerc [run] source. No -q here: CI passes -q itself, and -q -q drops
# the "N passed, M skipped" summary line from the job log.
addopts = --cov --cov-report=term-missing --cov-config=.coveragerc
# Silence only benign, non-actionable GC-timing noise: "unclosed database"
# ResourceWarning from sqlite3.Connection objects collected without an explicit
# close(). Connections we own are closed in fixtures; the residue comes from
# tests that legitimately spin up multiple app instances and from coverage.py's
# own data file.
filterwarnings =
    ignore:unclosed database:ResourceWarning
    # Starlette <1.10's testclient used the anyio.abc.BlockingPortal alias that
    # anyio 4.14 deprecated; 1.10 uses anyio.from_thread.BlockingPortal, so this
    # filter is dead once starlette>=1.10 is floored.
    ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning:starlette.testclient
