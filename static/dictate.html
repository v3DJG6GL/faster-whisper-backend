<!doctype html>
<!--
  Live dictation page for /v1/audio/transcriptions/stream.

  Rendered through web_common.render_page (NOT served as a plain static file),
  so it carries the same header, nav, scale picker, severity pills and sign-out
  as every other WebUI page and the double-brace placeholders below are
  substituted server-side.

  Auth: the session cookie the rest of the WebUI already uses. There is no API
  key field and no server field — the page talks to the origin that served it,
  the browser attaches the cookie to both the WebSocket handshake and the batch
  POST, and a signed-out visitor gets the shared login gate like anywhere else.

  Audio: captures the mic via an AudioWorklet, downsamples to 16 kHz mono s16le
  PCM, streams it over the WebSocket, and renders LocalAgreement stabilized
  partials (committed bold + provisional faded) plus append-only finals.
  Self-contained — no CDNs.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{HEADER_TITLE}}</title>
{{PAGE_META}}
{{SCALE_BOOTSTRAP_HEAD}}
<style>
  :root {
    --bg: #0d1117;
    --panel: #161b22;
    --fg: #c9d1d9;
    --dim: #6e7681;
    --help: #8b949e;
    --bold: #f0f6fc;
    --cyan: #79c0ff;
    --green: #7ee787;
    --yellow: #f2cc60;
    --red: #ff7b72;
    --border: #30363d;
    --input-bg: #0d1117;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  /* Chrome is sans like every other page — the shared header inherits the
     body font, and mono at 1rem is wide enough to wrap the nav row. The
     transcript (#doc) and code snippets opt back into mono below. Subbar
     controls come entirely from NAV_CSS; no local overrides. */
  body {
    background: var(--bg); color: var(--fg);
    font: 1rem/1.5 var(--font-sans);
    display: flex; flex-direction: column; min-height: 100%;
  }
  input, textarea, select, kbd, code, pre { font-family: var(--font-mono); }

  main { flex: 1; padding: 1.25rem; overflow: auto; }
  #doc {
    white-space: pre-wrap; word-break: break-word; line-height: 1.65;
    font: var(--fs-lg)/1.65 var(--font-mono); min-height: 6rem; max-width: 60rem;
  }
  #final { color: var(--fg); }        /* committed: locked, append-only */
  #tail { color: var(--help); }       /* provisional: may still firm up */
  #partial { color: var(--dim); }
  #partial .committed { color: var(--fg); }
  #partial .pending { color: var(--dim); opacity: 0.6; font-style: italic; }

  footer {
    padding: 0.6rem 1.25rem; border-top: 1px solid var(--border);
    font-size: var(--fs-sm); color: var(--help);
  }
  footer code {
    font-family: var(--font-mono); color: var(--cyan);
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 3px; padding: 0 0.3em;
  }
  #note { margin-top: 0.4rem; color: var(--dim); }

  {{NAV_CSS}}

  /* Status states on top of the shared dim #status rule. These MUST sit
     AFTER NAV_CSS: its `header .subbar #status:not(.pill)` rule has the
     same specificity (0,1,2,1 -- :not() takes its argument's), so source
     order decides; placed before NAV_CSS the live/error colours lose and
     the status text stays --dim forever. */
  header .subbar #status.live { color: var(--green); }
  header .subbar #status.error { color: var(--red); }
</style>
</head>
<body>
<header>
  <div class="header-inner">
    <span class="title">{{HEADER_BRAND}}</span>{{HEADER_VTAG}}
    <span class="brand-sep" aria-hidden="true"></span>
    {{NAV}}
    <span class="spacer"></span>
    <span class="hdr-right">{{SEV_PILLS}}{{SCALE_PICKER}}{{RELOAD}}{{LOGOUT}}</span>
  </div>
  <div class="subbar">
    <span class="subbar-title">Dictate</span>
    <div class="subbar-left">
      <label>mode
        <select id="mode" title="Streaming: live partials over a WebSocket. Batch: record, then POST the whole clip to /v1/audio/transcriptions (one-shot, full pipeline).">
          <option value="stream">streaming (live)</option>
          <option value="batch">batch (record &amp; send)</option>
        </select>
      </label>
      <label>model <input type="text" id="model" value="whisper-1" size="13"></label>
      <label>lang <input type="text" id="lang" value="de" size="3"></label>
      <label>format
        <select id="format">
          <option value="json">json</option>
          <option value="verbose_json">verbose_json</option>
        </select>
      </label>
      <button id="toggle">Start dictation</button>
      <span id="status">idle</span>
    </div>
  </div>
</header>
<main>
  <div id="doc"><span id="final"></span><span id="tail"></span><span id="partial"></span></div>
</main>
<footer>
  Speak commands: <code>Punkt</code> &rarr; . &nbsp; <code>Komma</code> &rarr; , &nbsp;
  <code>neue Zeile</code> &rarr; newline &nbsp; <code>Klammer auf/zu</code> &rarr; ( )
  <div id="note"></div>
</footer>

{{SCALE_PICKER_JS}}
{{SEV_POLLER_JS}}
<script>
(() => {
  "use strict";
  const TARGET_SR = 16000;
  const FRAME_SAMPLES = 4096;           // ~256 ms per WS binary frame at 16 kHz
  const $ = (id) => document.getElementById(id);
  const finalEl = $("final"), tailEl = $("tail"), partialEl = $("partial"),
        statusEl = $("status"), toggleBtn = $("toggle");

  let ws = null, audioCtx = null, workletNode = null, mediaStream = null, running = false;
  let resampleCarry = 0.0, resamplePos = 0.0, pcmBuf = new Int16Array(FRAME_SAMPLES), pcmLen = 0;
  // Batch mode: record the whole clip with MediaRecorder, POST it in one shot.
  let recorder = null, recStream = null, recChunks = [];

  function setStatus(text, cls) { statusEl.textContent = text; statusEl.className = cls || ""; }
  const mode = () => $("mode").value;

  // This page is served by the backend it talks to, so both transports target
  // the page's own origin and the session cookie rides along automatically —
  // no key field, no server field, no CORS. A remote backend is reached by
  // opening ITS /dictate, which is also where its credentials live.
  const wsBase = () =>
    (location.protocol === "https:" ? "wss" : "ws") + "://" + location.host;

  // Settings persisted per browser. The credential is the session cookie, so
  // there has never been anything secret to keep out of this blob — but an
  // older build of this page did store an API key here, hence the cleanup.
  const PREF_FIELDS = ["mode", "model", "lang", "format"];

  function loadPrefs() {
    let saved = {};
    try { saved = JSON.parse(localStorage.getItem("dictatePrefs") || "{}"); } catch {}
    for (const f of PREF_FIELDS) if (saved[f] != null && $(f)) $(f).value = saved[f];
    if (saved.key != null || saved.server != null) savePrefs();
  }
  function savePrefs() {
    const o = {};
    for (const f of PREF_FIELDS) if ($(f)) o[f] = $(f).value;
    try { localStorage.setItem("dictatePrefs", JSON.stringify(o)); } catch {}
  }

  // AudioWorklet processor: forward raw Float32 mic frames to the main thread.
  const workletSrc = `
    class Cap extends AudioWorkletProcessor {
      process(inputs) {
        const ch = inputs[0][0];
        if (ch) this.port.postMessage(ch.slice(0));
        return true;
      }
    }
    registerProcessor('cap', Cap);
  `;

  // Linear-resample incoming Float32 (at ctxRate) down to TARGET_SR, pack to
  // int16, and ship full frames as WS binary.
  function pushSamples(float32, srcRate) {
    const ratio = srcRate / TARGET_SR;
    let pos = resamplePos;
    while (pos < float32.length) {
      const i = Math.floor(pos);
      const frac = pos - i;
      const a = float32[i];
      const b = i + 1 < float32.length ? float32[i + 1] : resampleCarry;
      let s = a + (b - a) * frac;
      s = Math.max(-1, Math.min(1, s));
      pcmBuf[pcmLen++] = s < 0 ? s * 0x8000 : s * 0x7fff;
      if (pcmLen === FRAME_SAMPLES) {
        if (ws && ws.readyState === 1) ws.send(pcmBuf.buffer.slice(0));
        pcmLen = 0;
      }
      pos += ratio;
    }
    resampleCarry = float32[float32.length - 1];
    resamplePos = pos - float32.length;
  }

  function renderPartial(committed, pending) {
    partialEl.textContent = "";
    const c = document.createElement("span"); c.className = "committed"; c.textContent = committed || "";
    const p = document.createElement("span"); p.className = "pending"; p.textContent = pending || "";
    partialEl.append(c, p);
  }

  function onMessage(ev) {
    let m; try { m = JSON.parse(ev.data); } catch { return; }
    if (m.type === "ready") { setStatus("listening", "live"); }
    else if (m.type === "partial") { renderPartial(m.committed, m.pending); }
    else if (m.type === "final") {
      // committed = locked append-only prefix; tail = provisional trailing sentence.
      // Both are full strings (server re-sends them), so we replace, not append —
      // a post-processing seam rewrite can never desync the display.
      finalEl.textContent = m.committed || "";
      tailEl.textContent = m.tail || "";
      renderPartial("", "");
    }
    else if (m.type === "loading") {
      // Sent every ~3 s while a cold model load is in progress — without it the
      // page sits on "connecting…" for the whole load and reads as dead.
      setStatus("loading model " + (m.model || "") + "…");
    }
    else if (m.type === "error") { setStatus("error: " + (m.message || m.code), "error"); }
  }

  function idleLabel() { return mode() === "batch" ? "Record" : "Start dictation"; }
  function resetToggleButton() {
    toggleBtn.disabled = false;
    $("mode").disabled = false;
    toggleBtn.textContent = idleLabel();
    toggleBtn.classList.remove("danger");
  }

  // --- batch mode: record with MediaRecorder, POST the whole clip ---------------
  function pickMime() {
    const cands = ["audio/webm;codecs=opus", "audio/webm", "audio/ogg;codecs=opus", "audio/mp4"];
    for (const c of cands) {
      try { if (window.MediaRecorder && MediaRecorder.isTypeSupported(c)) return c; } catch {}
    }
    return "";
  }

  async function startBatch() {
    finalEl.textContent = ""; tailEl.textContent = ""; renderPartial("", "");
    recChunks = [];
    recStream = await navigator.mediaDevices.getUserMedia({ audio: { channelCount: 1, echoCancellation: true, noiseSuppression: true } });
    const mime = pickMime();
    recorder = mime ? new MediaRecorder(recStream, { mimeType: mime }) : new MediaRecorder(recStream);
    recorder.ondataavailable = (e) => { if (e.data && e.data.size) recChunks.push(e.data); };
    recorder.onstop = () => { sendBatch(); };
    recorder.start();
    setStatus("recording… (press Stop to transcribe)", "live");
  }

  function stopBatch() {
    // Stop the mic; recorder.onstop fires sendBatch(). Lock the button until the
    // POST resolves so the user can't re-enter mid-transcribe.
    toggleBtn.disabled = true;
    setStatus("transcribing…");
    try { if (recorder && recorder.state !== "inactive") recorder.stop(); } catch {}
    if (recStream) recStream.getTracks().forEach((t) => t.stop());
  }

  async function sendBatch() {
    try {
      const type = (recorder && recorder.mimeType) || "audio/webm";
      const blob = new Blob(recChunks, { type });
      recorder = null;
      if (!blob.size) { setStatus("no audio recorded", "error"); return; }
      const ext = type.includes("ogg") ? "ogg" : (type.includes("mp4") ? "mp4" : "webm");
      const fd = new FormData();
      fd.append("file", blob, "dictation." + ext);
      fd.append("model", $("model").value.trim() || "whisper-1");
      const lang = $("lang").value.trim(); if (lang) fd.append("language", lang);
      fd.append("response_format", $("format").value || "json");
      // Same origin, so the session cookie authenticates this POST. The CSRF
      // middleware wants the double-submit header on a cookie-authenticated
      // unsafe method; the shared chrome keeps window._csrfToken current.
      const headers = {};
      const csrf = typeof window._csrfToken === "function" ? window._csrfToken() : "";
      if (csrf) headers["X-CSRF-Token"] = csrf;
      const resp = await fetch("/v1/audio/transcriptions", {
        method: "POST", headers, body: fd, credentials: "same-origin",
      });
      if (!resp.ok) {
        setStatus("batch error " + resp.status + ": " + (await resp.text()).slice(0, 200), "error");
        return;
      }
      const ct = resp.headers.get("content-type") || "";
      let text;
      if (ct.includes("application/json")) {
        const j = await resp.json();
        text = (j && j.text != null) ? j.text : JSON.stringify(j, null, 2);
      } else {
        text = await resp.text();
      }
      finalEl.textContent = text || "";
      tailEl.textContent = ""; renderPartial("", "");
      setStatus("done", "live");
    } catch (err) {
      setStatus("batch failed: " + err.message, "error");
    } finally {
      running = false;
      if (recStream) { recStream.getTracks().forEach((t) => t.stop()); recStream = null; }
      resetToggleButton();
    }
  }

  async function start() {
    finalEl.textContent = ""; tailEl.textContent = ""; renderPartial("", "");
    const base = wsBase();
    // No subprotocol and no key: same origin, so the browser attaches the
    // HttpOnly session cookie to the handshake, and auth._resolve_user reads it
    // exactly as it does for every other page request.
    ws = new WebSocket(base + "/v1/audio/transcriptions/stream");
    ws.binaryType = "arraybuffer";
    setStatus("connecting…");

    ws.onopen = () => {
      ws.send(JSON.stringify({
        type: "config", model: $("model").value.trim() || "whisper-1",
        language: $("lang").value.trim() || null,
        response_format: $("format").value || "json",
        audio: { format: "pcm_s16le", sample_rate: TARGET_SR },
      }));
    };
    ws.onmessage = onMessage;
    ws.onerror = () => setStatus("socket error", "error");
    ws.onclose = (ev) => {
      if (running) stop();
      // 4401 is the server's "no valid credential" close code — on this page
      // that means the session expired, so point at the fix instead of a bare
      // "closed". 4403 is the handshake origin check. 4503 is the server's
      // "streaming disabled" close (STREAMING_ENABLED off) — batch mode on
      // this page still works, only the live socket is refused.
      if (ev && ev.code === 4401) setStatus("signed out — reload to sign in again", "error");
      else if (ev && ev.code === 4403) setStatus("handshake rejected (origin)", "error");
      else if (ev && ev.code === 4503) setStatus("live dictation is disabled on this server", "error");
      else setStatus("closed");
    };

    try {
      mediaStream = await navigator.mediaDevices.getUserMedia({ audio: { channelCount: 1, echoCancellation: true, noiseSuppression: true } });
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const blobUrl = URL.createObjectURL(new Blob([workletSrc], { type: "application/javascript" }));
      await audioCtx.audioWorklet.addModule(blobUrl);
      const src = audioCtx.createMediaStreamSource(mediaStream);
      workletNode = new AudioWorkletNode(audioCtx, "cap");
      const sr = audioCtx.sampleRate;
      workletNode.port.onmessage = (e) => { if (running) pushSamples(e.data, sr); };
      src.connect(workletNode);
      // Keep the node pulling without routing mic to speakers (avoids feedback).
      const sink = audioCtx.createGain(); sink.gain.value = 0; workletNode.connect(sink); sink.connect(audioCtx.destination);
    } catch (err) {
      // Mic denied / worklet load failed after the socket already opened: tear
      // down the socket + audio graph so we don't leak a live server-side
      // session. Detach ALL socket handlers first so neither this close nor an
      // already-queued server "ready"/"error" message clobbers the caller's
      // "mic/socket failed: …" status with a stale "listening"/"closed"/"error".
      try { if (ws) { ws.onmessage = ws.onclose = ws.onerror = null; ws.close(); } } catch {}
      try { if (mediaStream) mediaStream.getTracks().forEach((t) => t.stop()); } catch {}
      try { if (audioCtx) audioCtx.close(); } catch {}
      ws = null; audioCtx = null; workletNode = null; mediaStream = null;
      throw err;
    }
  }

  function stop() {
    running = false;
    try { if (ws && ws.readyState === 1) { ws.send(JSON.stringify({ type: "stop" })); } } catch {}
    try { if (ws) { ws.onmessage = ws.onclose = ws.onerror = null; ws.close(); } } catch {}
    if (mediaStream) mediaStream.getTracks().forEach((t) => t.stop());
    if (audioCtx) audioCtx.close();
    ws = null; audioCtx = null; workletNode = null; mediaStream = null;
    pcmLen = 0; resamplePos = 0; resampleCarry = 0.0;
    resetToggleButton();
    setStatus("idle");
  }

  toggleBtn.addEventListener("click", async () => {
    const batch = mode() === "batch";
    if (running) { batch ? stopBatch() : stop(); return; }
    try {
      running = true;
      $("mode").disabled = true;
      toggleBtn.textContent = batch ? "Stop & transcribe" : "Stop";
      toggleBtn.classList.add("danger");
      await (batch ? startBatch() : start());
    } catch (err) {
      running = false;
      setStatus((batch ? "mic/record failed: " : "mic/socket failed: ") + err.message, "error");
      resetToggleButton();
    }
  });

  // Switching mode while idle just relabels the button (Start dictation ⇄ Record).
  $("mode").addEventListener("change", () => { if (!running) resetToggleButton(); });

  // --- init: restore saved settings, persist on change, warn on insecure context ---
  loadPrefs();
  resetToggleButton();   // reflect the restored mode (Start dictation / Record)
  PREF_FIELDS.forEach((f) => { const el = $(f); if (el) el.addEventListener("change", savePrefs); });
  if (!window.isSecureContext) {
    const n = $("note");
    n.textContent = "⚠ Microphone needs a secure context (https or localhost). "
      + "Open this page over https, or from localhost.";
    n.style.color = "var(--red)";
  } else {
    $("note").textContent = "Settings are saved in this browser. Batch mode records the "
      + "clip and POSTs it to /v1/audio/transcriptions in one shot (full pipeline); "
      + "streaming mode shows live partials over a WebSocket.";
  }
})();
</script>
</body>
</html>
